# Render Blueprint for the FoNix API (free tier, no credit card).
#
# The database is NOT created here. Render's free Postgres expires after ~90
# days, so FoNix uses Neon instead (free tier that does not expire). You paste
# the Neon connection string into DATABASE_URL below. Full walkthrough:
# docs/DEPLOY.md.
#
# In the Render dashboard: New > Blueprint, connect this repo, apply. Then set
# the three sync:false vars (DATABASE_URL from Neon; the two origin vars from
# your Vercel URL) in the dashboard, and deploy.

services:
  - type: web
    name: fonix-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Override the image CMD: migrate, (re)seed the demo catalogue and team,
    # then gunicorn. Reseeding each boot is deliberate on a free host with an
    # ephemeral disk -- it rewrites the car images. See backend/render-start.sh.
    dockerCommand: sh render-start.sh
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      # Django serves /media/ itself here; there is no Caddy in this deploy.
      - key: SERVE_MEDIA
        value: "1"
      # A fresh production secret, generated by Render (never the local one).
      - key: SECRET_KEY
        generateValue: true
      # Paste your Neon connection string here (Dashboard > Connect > append
      # ?sslmode=require if it is not already on the URL). Not created by Render.
      - key: DATABASE_URL
        sync: false
      # Set both of these to your Vercel URL (no trailing slash) once the
      # frontend is deployed, e.g. https://fonix.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
