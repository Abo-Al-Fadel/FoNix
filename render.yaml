# Render Blueprint for the FoNix API + Postgres (free tier, no credit card).
#
# In the Render dashboard: New > Blueprint, connect this repo, apply. It creates
# the Docker web service and a free Postgres and wires DATABASE_URL between them.
# After your frontend is on Vercel, fill the two origin vars below with that URL.
# Full walkthrough: docs/DEPLOY.md.

databases:
  - name: fonix-db
    plan: free
    databaseName: fonix
    user: fonix

services:
  - type: web
    name: fonix-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Override the image CMD: migrate, (re)seed the demo catalogue and team,
    # then gunicorn. Reseeding each boot is deliberate on a free host with an
    # ephemeral disk -- it rewrites the car images. See backend/render-start.sh.
    dockerCommand: sh render-start.sh
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      # Django serves /media/ itself here; there is no Caddy in this deploy.
      - key: SERVE_MEDIA
        value: "1"
      # A fresh production secret, generated by Render (never the local one).
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fonix-db
          property: connectionString
      # Set both of these to your Vercel URL (no trailing slash) once the
      # frontend is deployed, e.g. https://fonix.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
