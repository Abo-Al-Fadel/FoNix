# Formatter configuration.
#
# Committed so that `black .` and `isort .` produce identical output on any
# machine -- otherwise two developers with different defaults reformat each
# other's files and every diff is noise.

[tool.black]
line-length = 88          # black's default, stated explicitly rather than implied
target-version = ["py312"]
extend-exclude = '''
/(
  migrations
)/
'''
# Migrations are generated by Django, not written by hand. They are excluded so
# that a `makemigrations` on a machine without black does not show up as a diff.

[tool.isort]
# The black profile is required, not optional: isort's default multi-line style
# disagrees with black, and without this the two tools fight -- each undoing the
# other's changes on every run.
profile = "black"
line_length = 88
skip_glob = ["*/migrations/*"]
# Teaches isort which imports are ours, so first-party and third-party end up in
# separate blocks instead of jumbled together.
known_first_party = ["accounts", "cars", "orders", "contact", "config"]
