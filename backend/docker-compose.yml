# Oracle Always Free (or any VM). Run from this directory:
#
#   cp .env.oracle.example .env
#   # edit .env
#   docker compose up -d --build
#
# Caddy terminates TLS and serves /media/. The API never talks to the public
# internet except through Caddy.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fonix
      POSTGRES_USER: fonix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fonix -d fonix"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    # Root so the media volume (created as root) is writable. One VM, one replica.
    user: "0:0"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://fonix:${POSTGRES_PASSWORD}@db:5432/fonix
      PORT: "8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/entrypoint.prod.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
